e="status"></div><script>window.SHIFT_CONFIG={"apiBase": "https://othman-live-shift.shimizumiki02.chatgpt.site", "admin": false};</script><script>const periodLabel=p=>fmt(p.start)+'–'+fmt(p.end);
const hourFixed=s=>Object.values(s.assignments||{}).filter(Boolean).length;

const API_BASE=window.SHIFT_CONFIG.apiBase;const ADMIN=window.SHIFT_CONFIG.admin;const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(d);const at=(d,n)=>{const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x};
const monday=d=>at(d,-(['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].indexOf(d.toLocaleDateString('en-US',{timeZone:'Asia/Tokyo',weekday:'short'}))));
const fmt=n=>String(Math.floor(n)).padStart(2,'0')+':'+(n%1?'30':'00');const jdate=d=>new Date(d+'T00:00:00+09:00').toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'long',day:'numeric',weekday:'short'});
let renderedWeek=null, renderedBegin=10;
let week=monday(new Date(iso(new Date())+'T00:00:00+09:00')),slots=[],selected=null,loading=false,busy=false,requestId=0;

if(!/^[a-f0-9]{64}$/.test(token)){token=Array.from(crypto.getRandomValues(new Uint8Array(32)),b=>b.toString(16).padStart(2,'0')).join('');try{localStorage.setItem('othman-edit-token',token)}catch{storageOK=false}}
function setStatus(text,error=false){$('#status').className=text?'status'+(error?' error':''):'';$('#status').textContent=text}
async function api(path,data){const res=await fetch(API_BASE+path,{method:data?'POST':'GET',headers:{'X-Edit-Token':token,...(data?{'Content-Type':'application/json'}:{})},body:data?JSON.stringify(data):undefined,cache:'no-store',signal:AbortSignal.timeout(20000)});let result;try{result=await res.json()}catch{throw new Error('サーバーに接続できません。再読込してください。')}if(!res.ok)throw new Error(result.error||'処理に失敗しました');return result}
async function load(){const current=++requestId;loading=true;setStatus('読み込み中…');try{const result=await api('/api/board?week='+iso(week));if(current!==requestId)return;slots=result.slots;setStatus(slots.length?'':'この週の募集はありません。');render()}catch(e){if(current===requestId){slots=[];render();setStatus(e.message||'接続できません。再読込してください。',true)}}finally{if(current===requestId)loading=false}}
function render(){const dates=Array.from({length:7},(_,i)=>at(week,i)),begin=Math.min(10,...slots.map(s=>Math.floor(s.start))),finish=Math.max(24,...slots.map(s=>Math.ceil(s.end))),hours=finish-begin;

 $('#weekTitle').textContent=week.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric'})+' – '+at(week,6).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'});
 $('#days').innerHTML='<div class="timezone">JST</div>'+dates.map(d=>'<div class="day '+(iso(d)===iso(new Date())?'current':'')+'"><span>'+d.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'})+'</span><b>'+d.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',day:'numeric'}).replace('日','')+'</b></div>').join('');
 $('#grid').style.height=(hours*60)+'px';$('#grid').innerHTML='<div class="timecol">'+Array.from({length:hours},(_,i)=>'<span class="time">'+fmt(i+begin)+'</span>').join('')+'</div>'+dates.map(d=>'<div class="col">'+slots.filter(s=>s.date===iso(d)).map(s=>{const assigned=s.answers.find(a=>a.id===s.assigned),fully=hourFixed(s)===s.periods.length,tiny=s.end-s.start<1;return '<button aria-label="'+jdate(s.date)+' '+fmt(s.start)+'から'+fmt(s.end)+' '+slotStatus(s)+'" class="event '+(fully?'fixed ':'')+'" data-id="'+s.id+'" style="top:calc('+((s.start-begin)/hours*100)+'% + 2px);height:calc('+((s.end-s.start)/hours*100)+'% - 4px);'+(tiny?'padding:1px;':'')+'"><span class="event-time">'+fmt(s.start)+(tiny?'':'<small>– '+fmt(s.end)+'</small>')+'</span>'+(s.end-s.start<=1?'':'<span class="event-status">'+(fully?'確定':hourFixed(s)?'一部確定':s.answers.filter(a=>a.available===1).length+'名 ○')+'</span>')+'</button>'}).join('')+'</div>').join('');
 timeline.scrollTop=Math.max(0,(targetHour-begin)*60);renderedWeek=iso(week);renderedBegin=begin;
 $('#grid').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;detail();$('#detailDialog').showModal()});if($('#detailDialog').open){if(slots.some(s=>s.id===selected))detail();else $('#detailDialog').close()}
}
function people(s,key){return s.answers.length?s.answers.map(a=>'<div class="person"><div class="avatar">'+esc(a.name.slice(0,1))+'</div><span class="name">'+esc(a.name)+'</span><span class="pill '+(a.availability[key]===1?'':'no')+'">'+(a.availability[key]===1?'○':a.availability[key]===0?'×':'未回答')+'</span></div>').join(''):'<p class="panel-note">まだ回答はありません。</p>'}
function detail(){const s=slots.find(s=>s.id===selected);if(!s)return;const mine=s.answers.find(a=>a.mine),periods=s.periods,allFixed=hourFixed(s)===periods.length;
 let draft=Object.fromEntries(periods.map(p=>[p.key,mine?.availability[p.key]??null]));
 const adminHours=()=>periods.map(p=>{const assigned=s.answers.find(a=>a.id===s.assignments[p.key]);return '<details class="hour-admin"><summary><b>'+periodLabel(p)+'</b><span>'+(assigned?esc(assigned.name):'○ '+s.answers.filter(a=>a.availability[p.key]===1).length+'名')+'</span></summary><div class="hour-content">'+people(s,p.key)+(assigned?'<button class="full" data-unassign="'+p.key+'">この時間の確定を解除</button>':'<select class="assign-select" data-select="'+p.key+'" aria-label="'+periodLabel(p)+'の担当者"><option value="">担当者を選択</option>'+s.answers.filter(a=>a.availability[p.key]===1).map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select><button class="primary full" data-confirm="'+p.key+'" disabled>この時間の担当を確定</button>')+'</div></details>'}).join('');
 $('#detail').innerHTML='<span class="tag '+(allFixed?'fixed':'')+'">'+slotStatus(s)+'</span><h3>'+jdate(s.date)+'</h3><div class="large-time">'+fmt(s.start)+' <span>–</span> '+fmt(s.end)+'</div>'+(ADMIN?adminHours()+'<div id="saveState" class="save-state" role="status"></div><button class="delete" id="delete">このコマを削除</button>':'<label for="respondent">名前</label><input class="name-input" id="respondent" autocomplete="name" maxlength="40" placeholder="名前を入力" value="'+esc(mine?.name||savedName)+'" '+(allFixed?'disabled':'')+'>'+(!allFixed?'<div class="bulk"><button data-all="1">すべて○</button><button data-all="0">すべて×</button></div>':'')+'<div class="hour-list">'+periods.map(p=>{const assigned=s.answers.find(a=>a.id===s.assignments[p.key]);return '<div class="hour-row"><span class="hour-label">'+periodLabel(p)+'</span>'+(assigned?'<span class="hour-assigned">'+esc(assigned.name)+'<small>確定</small></span>':'<div class="hour-choices">'+[1,0].map(v=>'<button data-hour="'+p.key+'" data-answer="'+v+'" aria-label="'+periodLabel(p)+' '+(v?'○':'×')+'" aria-pressed="'+(draft[p.key]===v)+'" class="'+(draft[p.key]===v?'chosen':'')+'">'+(v?'○':'×')+'</button>').join('')+'</div>')+'</div>'}).join('')+'</div>'+(!allFixed?'<button class="primary full save-answer" id="saveAnswer">回答を保存</button>':'')+'<div id="saveState" class="save-state" role="status">'+(mine?'登録済み':'')+'</div><details class="answer-summary"><summary>回答一覧（'+s.answers.length+'名）</summary>'+periods.map(p=>'<div class="subheading" style="margin-top:18px">'+periodLabel(p)+'</div>'+people(s,p.key)).join('')+'</details>');
 document.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>document.querySelector('[data-confirm="'+el.dataset.select+'"]').disabled=!el.value);

 const refreshDraft=()=>{document.querySelectorAll('[data-answer]').forEach(b=>{const chosen=draft[b.dataset.hour]===Number(b.dataset.answer);b.classList.toggle('chosen',chosen);b.setAttribute('aria-pressed',String(chosen))});$('#saveState').className='save-state';$('#saveState').textContent='未保存'};
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const k=b.dataset.hour,v=Number(b.dataset.answer);draft[k]=draft[k]===v?null:v;refreshDraft()});
 document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{periods.filter(p=>!s.assignments[p.key]).forEach(p=>draft[p.key]=Number(b.dataset.all));refreshDraft()});
 if($('#saveAnswer'))$('#saveAnswer').onclick=async()=>{const name=$('#respondent').value.trim();if(!name){$('#saveState').textContent='名前を入力してください';$('#saveState').className='save-state error';$('#respondent').focus();return}await mutate('/api/answer',{slot:s.id,name,availability:draft},false,name)};
}
async function mutate(path,data,close=false,name){if(busy)return;busy=true;const field=$('#saveState');if(field){field.className='save-state';field.textContent='保存中…'}const disabledBefore=new Map(Array.from($('#detail').querySelectorAll('button,select,input'),x=>[x,x.disabled]));disabledBefore.forEach((_,x)=>x.disabled=true);try{await api(path,data);if(name){savedName=name;try{localStorage.setItem('othman-name',name)}catch{}}if(close)$('#detailDialog').close();await load();if($('#saveState'))$('#saveState').textContent='保存しました'}catch(e){if($('#saveState')){$('#saveState').textContent=e.message||'保存できませんでした';$('#saveState').className='save-state error'}disabledBefore.forEach((disabled,x)=>x.disabled=disabled)}finally{busy=false}}
function openCreate(){$('#date').value=iso(week);$('#start').value=14;$('#end').value=16;$('#formError').textContent='';$('#createDialog').showModal()}
for(let h=0;h<=24;h+=.5){if(h<24)$('#start').add(new Option(fmt(h),h));if(h>0)$('#end').add(new Option(fmt(h),h))}
$('#createForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const date=$('#date').value,start=Number($('#start').value),end=Number($('#end').value);if(end<=start){$('#formError').textContent='終了時刻は開始より後にしてください';return}busy=true;const submit=$('#createForm button[type=submit]');submit.disabled=true;$('#formError').textContent='保存中…';try{await api('/api/admin/slot',{date,start,end});week=monday(new Date(date+'T00:00:00+09:00'));$('#createDialog').close();await load()}catch(e){$('#formError').textContent=e.message||'保存できませんでした'}finally{busy=false;submit.disabled=false}};
$('#roleLabel').textContent=ADMIN?'管理者':'参加登録';$('#add').classList.toggle('hidden',!ADMIN);$('#add').onclick=openCreate;$('#refresh').onclick=()=>load();$('#prev').onclick=()=>{week=at(week,-7);selected=null;load()};$('#next').onclick=()=>{week=at(week,7);selected=null;load()};$('#today').onclick=()=>{week=monday(new Date(iso(new Date())+'T00:00:00+09:00'));selected=null;load()};
for(const d of document.querySelectorAll('dialog')){d.querySelector('.close').onclick=()=>{if(!busy)d.close()};d.addEventListener('cancel',e=>{if(busy)e.preventDefault()});d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(!busy&&e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))d.close()});const handle=d.querySelector('.sheet-top');let y=null;handle.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});handle.addEventListener('touchend',e=>{if(!busy&&y!==null&&e.changedTouches[0].clientY-y>60)d.close();y=null},{passive:true})}
setInterval(()=>{if(!document.hidden&&!busy&&!loading&&!document.querySelector('dialog[open]'))load()},30000);render();load();
</script></body></html>
