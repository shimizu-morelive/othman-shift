}
function render(){const dates=Array.from({length:7},(_,i)=>at(week,i)),begin=Math.min(10,...slots.map(s=>Math.floor(s.start))),finish=Math.max(24,...slots.map(s=>Math.ceil(s.end))),hours=finish-begin;
 const timeline=$('#timeScroll'),targetHour=renderedWeek===iso(week)?renderedBegin+timeline.scrollTop/60:15;
 $('#weekTitle').textContent=week.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'numeric',day:'numeric'})+' – '+at(week,6).toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric'});
 $('#days').innerHTML='<div class="timezone">JST</div>'+dates.map(d=>'<div class="day '+(iso(d)===iso(new Date())?'current':'')+'"><span>'+d.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',weekday:'short'})+'</span><b>'+d.toLocaleDateString('ja-JP',{timeZone:'Asia/Tokyo',day:'numeric'}).replace('日','')+'</b></div>').join('');
 $('#grid').style.height=(hours*60)+'px';$('#grid').innerHTML='<div class="timecol">'+Array.from({length:hours},(_,i)=>'<span class="time">'+fmt(i+begin)+'</span>').join('')+'</div>'+dates.map(d=>'<div class="col">'+slots.filter(s=>s.date===iso(d)).map(s=>{const assigned=s.answers.find(a=>a.id===s.assigned),fully=hourFixed(s)===s.periods.length,tiny=s.end-s.start<1;return '<button aria-label="'+jdate(s.date)+' '+fmt(s.start)+'から'+fmt(s.end)+' '+slotStatus(s)+'" class="event '+(fully?'fixed ':'')+'" data-id="'+s.id+'" style="top:calc('+((s.start-begin)/hours*100)+'% + 2px);height:calc('+((s.end-s.start)/hours*100)+'% - 4px);'+(tiny?'padding:1px;':'')+'"><span class="event-time">'+fmt(s.start)+(tiny?'':'<small>– '+fmt(s.end)+'</small>')+'</span>'+(s.end-s.start<=1?'':'<span class="event-status">'+(fully?'確定':hourFixed(s)?'一部確定':s.answers.filter(a=>a.available===1).length+'名 ○')+'</span>')+'</button>'}).join('')+'</div>').join('');
 timeline.scrollTop=Math.max(0,(targetHour-begin)*60);lastTimelineScroll=timeline.scrollTop;renderedWeek=iso(week);renderedBegin=begin;
 $('#grid').querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{selected=b.dataset.id;detail();$('#detailDialog').showModal()});if($('#detailDialog').open){if(slots.some(s=>s.id===selected))detail();else $('#detailDialog').close()}
}
function people(s,key){return s.answers.length?s.answers.map(a=>'<div class="person"><div class="avatar">'+esc(a.name.slice(0,1))+'</div><span class="name">'+esc(a.name)+'</span><span class="pill '+(a.availability[key]===1?'':'no')+'">'+(a.availability[key]===1?'○':a.availability[key]===0?'×':'未回答')+'</span></div>').join(''):'<p class="panel-note">まだ回答はありません。</p>'}
function detail(){const s=slots.find(s=>s.id===selected);if(!s)return;const mine=s.answers.find(a=>a.mine),periods=s.periods,allFixed=hourFixed(s)===periods.length;
 let draft=Object.fromEntries(periods.map(p=>[p.key,mine?.availability[p.key]??null]));
 const adminHours=()=>periods.map(p=>{const assigned=s.answers.find(a=>a.id===s.assignments[p.key]);return '<details class="hour-admin"><summary><b>'+periodLabel(p)+'</b><span>'+(assigned?esc(assigned.name):'○ '+s.answers.filter(a=>a.availability[p.key]===1).length+'名')+'</span></summary><div class="hour-content">'+people(s,p.key)+(assigned?'<button class="full" data-unassign="'+p.key+'">この時間の確定を解除</button>':'<select class="assign-select" data-select="'+p.key+'" aria-label="'+periodLabel(p)+'の担当者"><option value="">担当者を選択</option>'+s.answers.filter(a=>a.availability[p.key]===1).map(a=>'<option value="'+a.id+'">'+esc(a.name)+'</option>').join('')+'</select><button class="primary full" data-confirm="'+p.key+'" disabled>この時間の担当を確定</button>')+'</div></details>'}).join('');
 $('#detail').innerHTML='<span class="tag '+(allFixed?'fixed':'')+'">'+slotStatus(s)+'</span><h3>'+jdate(s.date)+'</h3><div class="large-time">'+fmt(s.start)+' <span>–</span> '+fmt(s.end)+'</div>'+(ADMIN?adminHours()+'<div id="saveState" class="save-state" role="status"></div><button class="delete" id="delete">このコマを削除</button>':'<label for="respondent">名前</label><input class="name-input" id="respondent" autocomplete="name" maxlength="40" placeholder="名前を入力" value="'+esc(mine?.name||savedName)+'" '+(allFixed?'disabled':'')+'>'+(!allFixed?'<div class="bulk"><button data-all="1">すべて○</button><button data-all="0">すべて×</button></div>':'')+'<div class="hour-list">'+periods.map(p=>{const assigned=s.answers.find(a=>a.id===s.assignments[p.key]);return '<div class="hour-row"><span class="hour-label">'+periodLabel(p)+'</span>'+(assigned?'<span class="hour-assigned">'+esc(assigned.name)+'<small>確定</small></span>':'<div class="hour-choices">'+[1,0].map(v=>'<button data-hour="'+p.key+'" data-answer="'+v+'" aria-label="'+periodLabel(p)+' '+(v?'○':'×')+'" aria-pressed="'+(draft[p.key]===v)+'" class="'+(draft[p.key]===v?'chosen':'')+'">'+(v?'○':'×')+'</button>').join('')+'</div>')+'</div>'}).join('')+'</div>'+(!allFixed?'<button class="primary full save-answer" id="saveAnswer">回答を保存</button>':'')+'<div id="saveState" class="save-state" role="status">'+(mine?'登録済み':'')+'</div><details class="answer-summary"><summary>回答一覧（'+s.answers.length+'名）</summary>'+periods.map(p=>'<div class="subheading" style="margin-top:18px">'+periodLabel(p)+'</div>'+people(s,p.key)).join('')+'</details>');
 document.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>document.querySelector('[data-confirm="'+el.dataset.select+'"]').disabled=!el.value);
 document.querySelectorAll('[data-confirm]').forEach(el=>el.onclick=()=>mutate('/api/admin/assign',{id:s.id,revision:s.revision,hour:el.dataset.confirm,answer:document.querySelector('[data-select="'+el.dataset.confirm+'"]').value}));
 document.querySelectorAll('[data-unassign]').forEach(el=>el.onclick=()=>mutate('/api/admin/assign',{id:s.id,revision:s.revision,hour:el.dataset.unassign,answer:null}));
 if($('#delete'))$('#delete').onclick=()=>{if(confirm('このコマと回答を削除しますか？'))mutate('/api/admin/delete',{id:s.id,revision:s.revision},true)};
 const refreshDraft=()=>{document.querySelectorAll('[data-answer]').forEach(b=>{const chosen=draft[b.dataset.hour]===Number(b.dataset.answer);b.classList.toggle('chosen',chosen);b.setAttribute('aria-pressed',String(chosen))});$('#saveState').className='save-state';$('#saveState').textContent='未保存'};
 document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{const k=b.dataset.hour,v=Number(b.dataset.answer);draft[k]=draft[k]===v?null:v;refreshDraft()});
 document.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{periods.filter(p=>!s.assignments[p.key]).forEach(p=>draft[p.key]=Number(b.dataset.all));refreshDraft()});
 if(mine){const cancel=document.createElement('button');cancel.className='delete';cancel.textContent='自分の回答を取り消す';cancel.onclick=()=>{if(confirm('このコマの自分の回答を取り消します。自分が担当に確定している時間も募集に戻ります。よろしいですか？'))mutate('/api/answer/cancel',{slot:s.id,revision:s.revision},true)};$('#detail').append(cancel)};
 const historySection=document.createElement('details');historySection.className='answer-summary history-summary';
 const historySummary=document.createElement('summary');historySummary.textContent='変更履歴';
 const historyContent=document.createElement('div');historyContent.className='slot-history';
 historySection.append(historySummary,historyContent);
 historySection.ontoggle=()=>{if(historySection.open)showSlotHistory(s,historyContent)};
 const answerSummary=$('#detail .answer-summary');
 if(answerSummary)answerSummary.after(historySection);else $('#detail').insertBefore(historySection,$('#delete'));
 if($('#saveAnswer'))$('#saveAnswer').onclick=async()=>{const name=$('#respondent').value.trim();if(!name){$('#saveState').textContent='名前を入力してください';$('#saveState').className='save-state error';$('#respondent').focus();return}await mutate('/api/answer',{slot:s.id,name,availability:draft},false,name)};
}
function applySaved(result){
 ++requestId;loading=false;++cacheEpoch;weekRequests.clear();weekCache.clear();
 if(result.deleted){slots=slots.filter(s=>s.id!==result.deleted);render()}
 else if(result.slot){
  const updated=result.slot,index=slots.findIndex(s=>s.id===updated.id);
  if(index>=0)slots[index]=updated;else if(updated.date>=iso(week)&&updated.date<=iso(at(week,6)))slots.push(updated);
  const event=Array.from($('#grid').querySelectorAll('[data-id]')).find(b=>b.dataset.id===updated.id);
  if(event){
   const fully=hourFixed(updated)===updated.periods.length;
   event.classList.toggle('fixed',fully);event.setAttribute('aria-label',jdate(updated.date)+' '+fmt(updated.start)+'から'+fmt(updated.end)+' '+slotStatus(updated));
   const label=event.querySelector('.event-status');if(label)label.textContent=fully?'確定':hourFixed(updated)?'一部確定':updated.answers.filter(a=>a.available===1).length+'名 ○';
   if($('#detailDialog').open&&selected===updated.id){const scroll=$('#detailDialog').scrollTop;detail();$('#detailDialog').scrollTop=scroll}
  }else render();
 }
 rememberWeek(iso(week),slots);
 setStatus(slots.length?'':'この週の募集はありません。');
}
async function mutate(path,data,close=false,name){
 if(busy)return;busy=true;++requestId;loading=false;
 const field=$('#saveState');if(field){field.className='save-state';field.textContent='保存中…'}
 const disabledBefore=new Map(Array.from($('#detail').querySelectorAll('button,select,input'),x=>[x,x.disabled]));disabledBefore.forEach((_,x)=>x.disabled=true);
 try{
  const result=await api(path,data);
  if(name){savedName=result.slot?.answers.find(a=>a.mine)?.name||name;try{localStorage.setItem('othman-name',savedName)}catch{}}
  if(close)$('#detailDialog').close();
  applySaved(result);
  if($('#saveState')){$('#saveState').className='save-state';$('#saveState').textContent='保存しました'}
 }catch(e){if($('#saveState')){$('#saveState').textContent=e.message||'保存できませんでした';$('#saveState').className='save-state error'}disabledBefore.forEach((disabled,x)=>x.disabled=disabled)}finally{busy=false}
}
function openCreate(){$('#date').value=iso(week);$('#start').value=14;$('#end').value=16;$('#formError').textContent='';$('#createDialog').showModal()}
for(let h=0;h<=24;h+=.5){if(h<24)$('#start').add(new Option(fmt(h),h));if(h>0)$('#end').add(new Option(fmt(h),h))}
$('#createForm').onsubmit=async e=>{e.preventDefault();if(busy)return;const date=$('#date').value,start=Number($('#start').value),end=Number($('#end').value);if(end<=start){$('#formError').textContent='終了時刻は開始より後にしてください';return}busy=true;const submit=$('#createForm button[type=submit]');submit.disabled=true;$('#formError').textContent='保存中…';try{const result=await api('/api/admin/slot',{date,start,end});const nextWeek=startOfWeek(new Date(date+'T00:00:00+09:00'));const changedWeek=iso(nextWeek)!==iso(week);if(changedWeek){week=nextWeek;slots=[]}$('#createDialog').close();applySaved(result);if(changedWeek){busy=false;load(true)}}catch(e){$('#formError').textContent=e.message||'保存できませんでした'}finally{busy=false;submit.disabled=false}};
$('#roleLabel').textContent=ADMIN?'管理者':'参加登録';$('#add').classList.toggle('hidden',!ADMIN);$('#add').onclick=openCreate;$('#refresh').onclick=()=>load(true);$('#prev').onclick=()=>{week=at(week,-7);selected=null;load()};$('#next').onclick=()=>{week=at(week,7);selected=null;load()};$('#today').onclick=()=>{week=startOfWeek(new Date(iso(new Date())+'T00:00:00+09:00'));selected=null;load()};
$('#weekStart').value=String(weekStart);
$('#weekStart').onchange=()=>{
 const today=new Date(iso(new Date())+'T00:00:00+09:00');
 const anchor=iso(today)>=iso(week)&&iso(today)<=iso(at(week,6))?today:at(week,3);
 weekStart=Number($('#weekStart').value);
 try{localStorage.setItem('othman-week-start',String(weekStart))}catch{}
 week=startOfWeek(anchor);selected=null;load();
};
for(const d of document.querySelectorAll('dialog')){d.querySelector('.close').onclick=()=>{if(!busy)d.close()};d.addEventListener('cancel',e=>{if(busy)e.preventDefault()});d.addEventListener('click',e=>{const r=d.getBoundingClientRect();if(!busy&&e.target===d&&(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom))d.close()});const handle=d.querySelector('.sheet-top');let y=null;handle.addEventListener('touchstart',e=>{y=e.touches[0].clientY},{passive:true});handle.addEventListener('touchend',e=>{if(!busy&&y!==null&&e.changedTouches[0].clientY-y>60)d.close();y=null},{passive:true})}
const historyValue=(raw,item)=>{
 if(!raw)return '—';const v=JSON.parse(raw);
 if('availability' in v){const a=v.availability?JSON.parse(v.availability):Object.fromEntries(Array.from({length:Math.ceil(item.end-item.start)},(_,i)=>[item.start+i,v.available]));return Object.entries(a).map(([h,x])=>fmt(Number(h))+' '+(x===1?'○':x===0?'×':'未回答')).join(' / ')}
 const a=JSON.parse(v.assignments||'{}'),names=typeof v.names==='string'?JSON.parse(v.names):v.names||{};
 return Object.entries(a).map(([h,id])=>fmt(Number(h))+' '+(id?(names[id]||'担当者'):'未確定')).join(' / ')||'未確定';
};
async function showSlotHistory(slot,content){
 content.textContent='読み込み中…';
 try{const result=await api('/api/history?slot='+encodeURIComponent(slot.id));
 content.innerHTML='<p class="history-note">このコマの変更履歴（最新200件）</p>'+ (result.history.length?result.history.map(item=>'<article class="history-item"><time>'+esc(new Date(item.created_at).toLocaleString('ja-JP',{timeZone:'Asia/Tokyo'}))+'</time><p>'+(item.action==='担当を変更'?'':esc(item.name)+' · ')+esc(item.action)+'</p><div>'+esc(jdate(item.date))+' '+fmt(item.start)+'–'+fmt(item.end)+'</div>'+(item.before||item.after?'<small>'+esc(historyValue(item.before,item))+' → '+esc(historyValue(item.after,item))+'</small>':'')+'</article>').join(''):'<p class="history-note">このコマの変更履歴はありません。</p>');
 }catch(e){content.textContent=e.message||'履歴を取得できませんでした'}
};
$('#timeScroll').addEventListener('scroll',()=>{
 const timeline=$('#timeScroll'),delta=timeline.scrollTop-lastTimelineScroll;
 lastTimelineScroll=timeline.scrollTop;
 if(Math.abs(delta)>1){const wrap=$('.wrap'),top=$('.calendar').offsetTop;wrap.scrollTop=Math.max(0,Math.min(top,wrap.scrollTop+delta))}
},{passive:true});
setInterval(()=>{if(!document.hidden&&!busy&&!loading&&!document.querySelector('dialog[open]'))load(true)},30000);render();load(true);
</script></body></html>
